name: GOLDmicro Unit Tests

on:
  pull_request:
    paths:
      - 'RUN-GOLDMICRO-RESEARCH.bat'
      - 'src/broker_profile.py'
      - 'src/goldmicro_risk.py'
      - 'src/model_lifecycle.py'
      - 'src/model_registry.py'
      - 'src/challenger_batch.py'
      - 'src/shadow_evaluator.py'
      - 'src/goldmicro_candidate_trainer.py'
      - 'src/goldmicro_causal_hmm.py'
      - 'src/goldmicro_causal_v2.py'
      - 'src/candidate_screening.py'
      - 'src/multisample_screening.py'
      - 'src/mt5_research_connector.py'
      - 'config/goldmicro_model_lifecycle.json'
      - 'docs/GOLDMICRO_MODEL_LIFECYCLE.md'
      - 'backtests/goldmicro_cost_model.py'
      - 'backtests/goldmicro_replay.py'
      - 'scripts/run_goldmicro_baseline.py'
      - 'scripts/run_goldmicro_baseline_isolated.py'
      - 'scripts/run_goldmicro_capital_sweep_isolated.py'
      - 'scripts/analyze_goldmicro_spread_profile.py'
      - 'scripts/dump_goldmicro_transaction_costs.py'
      - 'scripts/run_goldmicro_model_matrix.py'
      - 'scripts/run_goldmicro_cost_surface.py'
      - 'scripts/run_goldmicro_full_batch.py'
      - 'scripts/run_goldmicro_model_review_batch.py'
      - 'scripts/run_goldmicro_lifecycle_batch.py'
      - 'scripts/train_goldmicro_challenger_batch.py'
      - 'scripts/score_goldmicro_challenger_batch.py'
      - 'scripts/score_goldmicro_multisample_batch.py'
      - 'scripts/run_goldmicro_challenger_research.py'
      - 'scripts/goldmicro_research_preflight.py'
      - 'scripts/setup_goldmicro_research_env.ps1'
      - 'requirements-goldmicro-research.txt'
      - 'tests/test_broker_profile.py'
      - 'tests/test_goldmicro_risk_and_costs.py'
      - 'tests/test_goldmicro_replay.py'
      - 'tests/test_model_lifecycle.py'
      - 'tests/test_model_registry_and_shadow.py'
      - 'tests/test_goldmicro_candidate_trainer.py'
      - 'tests/test_goldmicro_causal_hmm.py'
      - 'tests/test_goldmicro_causal_v2.py'
      - 'tests/test_candidate_screening.py'
      - 'tests/test_multisample_screening.py'
      - 'tests/test_mt5_research_connector.py'
      - '.github/workflows/goldmicro-unit-tests.yml'
  push:
    branches:
      - 'feat/goldmicro-broker-profile-v1'
    paths:
      - 'RUN-GOLDMICRO-RESEARCH.bat'
      - 'src/broker_profile.py'
      - 'src/goldmicro_risk.py'
      - 'src/model_lifecycle.py'
      - 'src/model_registry.py'
      - 'src/challenger_batch.py'
      - 'src/shadow_evaluator.py'
      - 'src/goldmicro_candidate_trainer.py'
      - 'src/goldmicro_causal_hmm.py'
      - 'src/goldmicro_causal_v2.py'
      - 'src/candidate_screening.py'
      - 'src/multisample_screening.py'
      - 'src/mt5_research_connector.py'
      - 'config/goldmicro_model_lifecycle.json'
      - 'docs/GOLDMICRO_MODEL_LIFECYCLE.md'
      - 'backtests/goldmicro_cost_model.py'
      - 'backtests/goldmicro_replay.py'
      - 'scripts/run_goldmicro_baseline.py'
      - 'scripts/run_goldmicro_baseline_isolated.py'
      - 'scripts/run_goldmicro_capital_sweep_isolated.py'
      - 'scripts/analyze_goldmicro_spread_profile.py'
      - 'scripts/dump_goldmicro_transaction_costs.py'
      - 'scripts/run_goldmicro_model_matrix.py'
      - 'scripts/run_goldmicro_cost_surface.py'
      - 'scripts/run_goldmicro_full_batch.py'
      - 'scripts/run_goldmicro_model_review_batch.py'
      - 'scripts/run_goldmicro_lifecycle_batch.py'
      - 'scripts/train_goldmicro_challenger_batch.py'
      - 'scripts/score_goldmicro_challenger_batch.py'
      - 'scripts/score_goldmicro_multisample_batch.py'
      - 'scripts/run_goldmicro_challenger_research.py'
      - 'scripts/goldmicro_research_preflight.py'
      - 'scripts/setup_goldmicro_research_env.ps1'
      - 'requirements-goldmicro-research.txt'
      - 'tests/test_broker_profile.py'
      - 'tests/test_goldmicro_risk_and_costs.py'
      - 'tests/test_goldmicro_replay.py'
      - 'tests/test_model_lifecycle.py'
      - 'tests/test_model_registry_and_shadow.py'
      - 'tests/test_goldmicro_candidate_trainer.py'
      - 'tests/test_goldmicro_causal_hmm.py'
      - 'tests/test_goldmicro_causal_v2.py'
      - 'tests/test_candidate_screening.py'
      - 'tests/test_multisample_screening.py'
      - 'tests/test_mt5_research_connector.py'
      - '.github/workflows/goldmicro-unit-tests.yml'

permissions:
  contents: read

jobs:
  goldmicro-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install isolated test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest python-dotenv polars numpy loguru pandas openpyxl
          xgboost scikit-learn hmmlearn joblib

      - name: Syntax-check GOLDmicro runners and lifecycle modules
        run: >-
          python -m py_compile
          scripts/run_goldmicro_baseline.py
          scripts/run_goldmicro_baseline_isolated.py
          scripts/run_goldmicro_capital_sweep_isolated.py
          scripts/analyze_goldmicro_spread_profile.py
          scripts/dump_goldmicro_transaction_costs.py
          scripts/run_goldmicro_model_matrix.py
          scripts/run_goldmicro_cost_surface.py
          scripts/run_goldmicro_full_batch.py
          scripts/run_goldmicro_model_review_batch.py
          scripts/run_goldmicro_lifecycle_batch.py
          scripts/train_goldmicro_challenger_batch.py
          scripts/score_goldmicro_challenger_batch.py
          scripts/score_goldmicro_multisample_batch.py
          scripts/run_goldmicro_challenger_research.py
          scripts/goldmicro_research_preflight.py
          src/model_lifecycle.py
          src/model_registry.py
          src/challenger_batch.py
          src/shadow_evaluator.py
          src/goldmicro_candidate_trainer.py
          src/goldmicro_causal_hmm.py
          src/goldmicro_causal_v2.py
          src/candidate_screening.py
          src/multisample_screening.py
          src/mt5_research_connector.py

      - name: Run isolated GOLDmicro tests
        run: >-
          python -m pytest -q
          tests/test_broker_profile.py
          tests/test_goldmicro_risk_and_costs.py
          tests/test_goldmicro_replay.py
          tests/test_model_lifecycle.py
          tests/test_model_registry_and_shadow.py
          tests/test_goldmicro_candidate_trainer.py
          tests/test_goldmicro_causal_hmm.py
          tests/test_goldmicro_causal_v2.py
          tests/test_candidate_screening.py
          tests/test_multisample_screening.py
          tests/test_mt5_research_connector.py
