name: GOLDmicro Unit Tests

on:
  pull_request:
    paths:
      - 'src/broker_profile.py'
      - 'src/goldmicro_risk.py'
      - 'backtests/goldmicro_cost_model.py'
      - 'backtests/goldmicro_replay.py'
      - 'scripts/run_goldmicro_baseline.py'
      - 'scripts/run_goldmicro_baseline_isolated.py'
      - 'scripts/run_goldmicro_capital_sweep_isolated.py'
      - 'scripts/run_goldmicro_model_matrix.py'
      - 'scripts/analyze_goldmicro_spread_profile.py'
      - 'scripts/dump_goldmicro_transaction_costs.py'
      - 'tests/test_broker_profile.py'
      - 'tests/test_goldmicro_risk_and_costs.py'
      - 'tests/test_goldmicro_replay.py'
      - '.github/workflows/goldmicro-unit-tests.yml'
  push:
    branches:
      - 'feat/goldmicro-broker-profile-v1'
    paths:
      - 'src/broker_profile.py'
      - 'src/goldmicro_risk.py'
      - 'backtests/goldmicro_cost_model.py'
      - 'backtests/goldmicro_replay.py'
      - 'scripts/run_goldmicro_baseline.py'
      - 'scripts/run_goldmicro_baseline_isolated.py'
      - 'scripts/run_goldmicro_capital_sweep_isolated.py'
      - 'scripts/run_goldmicro_model_matrix.py'
      - 'scripts/analyze_goldmicro_spread_profile.py'
      - 'scripts/dump_goldmicro_transaction_costs.py'
      - 'tests/test_broker_profile.py'
      - 'tests/test_goldmicro_risk_and_costs.py'
      - 'tests/test_goldmicro_replay.py'
      - '.github/workflows/goldmicro-unit-tests.yml'

permissions:
  contents: read

jobs:
  goldmicro-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install isolated test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest python-dotenv polars numpy loguru pandas openpyxl
          xgboost scikit-learn hmmlearn joblib

      - name: Syntax-check baseline runners
        run: >-
          python -m py_compile
          scripts/run_goldmicro_baseline.py
          scripts/run_goldmicro_baseline_isolated.py
          scripts/run_goldmicro_capital_sweep_isolated.py
          scripts/run_goldmicro_model_matrix.py
          scripts/analyze_goldmicro_spread_profile.py
          scripts/dump_goldmicro_transaction_costs.py

      - name: Run isolated GOLDmicro tests
        run: >-
          python -m pytest -q
          tests/test_broker_profile.py
          tests/test_goldmicro_risk_and_costs.py
          tests/test_goldmicro_replay.py
