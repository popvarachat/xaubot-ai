name: GOLDmicro Causality and OOS Tests

on:
  pull_request:
    paths:
      - 'src/goldmicro_causal_smc.py'
      - 'src/goldmicro_strategy_oos.py'
      - 'scripts/train_goldmicro_causal_challenger_batch.py'
      - 'scripts/run_goldmicro_challenger_research.py'
      - 'scripts/run_goldmicro_strategy_oos.py'
      - 'tests/test_goldmicro_causal_smc.py'
      - 'tests/test_goldmicro_strategy_oos.py'
      - 'docs/handoffs/GOLDMICRO_BATCH_20260916_001333_CAUSALITY_REVIEW.md'
      - '.github/workflows/goldmicro-causality-oos-tests.yml'
  push:
    branches:
      - 'feat/goldmicro-broker-profile-v1'
    paths:
      - 'src/goldmicro_causal_smc.py'
      - 'src/goldmicro_strategy_oos.py'
      - 'scripts/train_goldmicro_causal_challenger_batch.py'
      - 'scripts/run_goldmicro_challenger_research.py'
      - 'scripts/run_goldmicro_strategy_oos.py'
      - 'tests/test_goldmicro_causal_smc.py'
      - 'tests/test_goldmicro_strategy_oos.py'
      - 'docs/handoffs/GOLDMICRO_BATCH_20260916_001333_CAUSALITY_REVIEW.md'
      - '.github/workflows/goldmicro-causality-oos-tests.yml'

permissions:
  contents: read

jobs:
  causality-oos-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install isolated research test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest python-dotenv polars numpy loguru pandas openpyxl
          xgboost scikit-learn hmmlearn joblib

      - name: Syntax check causal research and OOS gate
        run: >-
          python -m py_compile
          src/goldmicro_causal_smc.py
          src/goldmicro_strategy_oos.py
          scripts/train_goldmicro_causal_challenger_batch.py
          scripts/run_goldmicro_challenger_research.py
          scripts/run_goldmicro_strategy_oos.py

      - name: Run causality and strategy OOS guards
        run: >-
          python -m pytest -q
          tests/test_goldmicro_causal_smc.py
          tests/test_goldmicro_strategy_oos.py
