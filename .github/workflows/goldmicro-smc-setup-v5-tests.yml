name: GOLDmicro SMC Setup V5 Tests

on:
  pull_request:
    paths:
      - 'src/goldmicro_smc_setup_v5.py'
      - 'tests/test_goldmicro_smc_setup_v5.py'
      - '.github/workflows/goldmicro-smc-setup-v5-tests.yml'
  push:
    branches:
      - 'feat/goldmicro-smc-setup-v5'
    paths:
      - 'src/goldmicro_smc_setup_v5.py'
      - 'tests/test_goldmicro_smc_setup_v5.py'
      - '.github/workflows/goldmicro-smc-setup-v5-tests.yml'

permissions:
  contents: read

jobs:
  smc-setup-v5-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research test dependencies
        run: python -m pip install --disable-pip-version-check pytest python-dotenv polars numpy loguru
      - name: Syntax check V5 module
        run: python -m py_compile src/goldmicro_smc_setup_v5.py tests/test_goldmicro_smc_setup_v5.py
      - name: Run V5 tests
        run: python -m pytest -q tests/test_goldmicro_smc_setup_v5.py
