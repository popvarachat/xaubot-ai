name: GOLDmicro SMC Setup V5 Tests

on:
  pull_request:
    paths:
      - 'src/goldmicro_smc_setup_v5.py'
      - 'src/goldmicro_smc_setup_v5_baseline.py'
      - 'src/goldmicro_smc_setup_v5_readiness.py'
      - 'src/goldmicro_smc_setup_v5_collector.py'
      - 'scripts/diagnose_goldmicro_smc_setup_v5_mechanics.py'
      - 'scripts/run_goldmicro_smc_setup_v5_baseline.py'
      - 'scripts/diagnose_goldmicro_smc_setup_v5_instability.py'
      - 'scripts/freeze_goldmicro_smc_setup_v5_prospective.py'
      - 'scripts/check_goldmicro_smc_setup_v5_readiness.py'
      - 'scripts/collect_goldmicro_smc_setup_v5_m15.py'
      - 'scripts/run_goldmicro_v5_daily.ps1'
      - 'scripts/install_goldmicro_v5_daily_task.ps1'
      - 'scripts/configure_goldmicro_v5_archive.ps1'
      - 'scripts/configure_goldmicro_v5_webhook.ps1'
      - 'ops/n8n/GOLDmicro_V5_Status_Ingest_STAGING.json'
      - 'ops/cloudflare/goldmicro-v5-status-staging/**'
      - 'tests/test_goldmicro_smc_setup_v5.py'
      - 'tests/test_goldmicro_smc_setup_v5_baseline.py'
      - 'tests/test_goldmicro_smc_setup_v5_readiness.py'
      - 'tests/test_goldmicro_smc_setup_v5_collector.py'
      - '.github/workflows/goldmicro-smc-setup-v5-tests.yml'
  push:
    branches:
      - 'feat/goldmicro-smc-setup-v5'
    paths:
      - 'src/goldmicro_smc_setup_v5.py'
      - 'src/goldmicro_smc_setup_v5_baseline.py'
      - 'src/goldmicro_smc_setup_v5_readiness.py'
      - 'src/goldmicro_smc_setup_v5_collector.py'
      - 'scripts/diagnose_goldmicro_smc_setup_v5_mechanics.py'
      - 'scripts/run_goldmicro_smc_setup_v5_baseline.py'
      - 'scripts/diagnose_goldmicro_smc_setup_v5_instability.py'
      - 'scripts/freeze_goldmicro_smc_setup_v5_prospective.py'
      - 'scripts/check_goldmicro_smc_setup_v5_readiness.py'
      - 'scripts/collect_goldmicro_smc_setup_v5_m15.py'
      - 'scripts/run_goldmicro_v5_daily.ps1'
      - 'scripts/install_goldmicro_v5_daily_task.ps1'
      - 'scripts/configure_goldmicro_v5_archive.ps1'
      - 'scripts/configure_goldmicro_v5_webhook.ps1'
      - 'ops/n8n/GOLDmicro_V5_Status_Ingest_STAGING.json'
      - 'ops/cloudflare/goldmicro-v5-status-staging/**'
      - 'tests/test_goldmicro_smc_setup_v5.py'
      - 'tests/test_goldmicro_smc_setup_v5_baseline.py'
      - 'tests/test_goldmicro_smc_setup_v5_readiness.py'
      - 'tests/test_goldmicro_smc_setup_v5_collector.py'
      - '.github/workflows/goldmicro-smc-setup-v5-tests.yml'

permissions:
  contents: read

jobs:
  smc-setup-v5-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install research test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest python-dotenv polars numpy loguru
          xgboost scikit-learn hmmlearn joblib
      - name: Syntax check V5 modules
        run: >-
          python -m py_compile
          src/goldmicro_smc_setup_v5.py
          src/goldmicro_smc_setup_v5_baseline.py
          src/goldmicro_smc_setup_v5_readiness.py
          src/goldmicro_smc_setup_v5_collector.py
          scripts/diagnose_goldmicro_smc_setup_v5_mechanics.py
          scripts/run_goldmicro_smc_setup_v5_baseline.py
          scripts/diagnose_goldmicro_smc_setup_v5_instability.py
          scripts/freeze_goldmicro_smc_setup_v5_prospective.py
          scripts/check_goldmicro_smc_setup_v5_readiness.py
          scripts/collect_goldmicro_smc_setup_v5_m15.py
          tests/test_goldmicro_smc_setup_v5.py
          tests/test_goldmicro_smc_setup_v5_baseline.py
          tests/test_goldmicro_smc_setup_v5_readiness.py
          tests/test_goldmicro_smc_setup_v5_collector.py
      - name: Parse PowerShell automation scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('scripts/run_goldmicro_v5_daily.ps1', 'scripts/install_goldmicro_v5_daily_task.ps1', 'scripts/configure_goldmicro_v5_archive.ps1', 'scripts/configure_goldmicro_v5_webhook.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Validate inactive n8n staging template
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('ops/n8n/GOLDmicro_V5_Status_Ingest_STAGING.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['name'].endswith('_STAGING')
          assert data['active'] is False
          assert data['meta']['research_only'] is True
          assert data['meta']['production_trading'] is False
          assert data['meta']['economic_outcomes'] == 'HIDDEN'
          assert data['meta']['promotion'] == 'DISABLED'
          assert data['meta']['activation_requires_human_gate'] is True
          PY
      - name: Test Cloudflare blind status worker
        run: |
          node --check ops/cloudflare/goldmicro-v5-status-staging/src/index.js
          node ops/cloudflare/goldmicro-v5-status-staging/test.mjs
      - name: Smoke test V5 research CLIs
        run: >-
          python scripts/diagnose_goldmicro_smc_setup_v5_mechanics.py --help
          && python scripts/run_goldmicro_smc_setup_v5_baseline.py --help
          && python scripts/diagnose_goldmicro_smc_setup_v5_instability.py --help
          && python scripts/freeze_goldmicro_smc_setup_v5_prospective.py --help
          && python scripts/check_goldmicro_smc_setup_v5_readiness.py --help
          && python scripts/collect_goldmicro_smc_setup_v5_m15.py --help
      - name: Run V5 tests
        run: >-
          python -m pytest -q
          tests/test_goldmicro_smc_setup_v5.py
          tests/test_goldmicro_smc_setup_v5_baseline.py
          tests/test_goldmicro_smc_setup_v5_readiness.py
          tests/test_goldmicro_smc_setup_v5_collector.py
